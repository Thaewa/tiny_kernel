name: Host Tests

# Run portable kernel tests for every pushed revision, every pull request,
# and whenever a developer starts the workflow manually from GitHub.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  # The workflow only needs permission to read the repository source.
  contents: read

jobs:
  binary-semaphore:
    name: Binary Semaphore
    runs-on: ubuntu-latest

    steps:
      # Download the exact source revision associated with this workflow run.
      - name: Check out repository
        uses: actions/checkout@v4

      # Compile the production semaphore module together with the host test
      # runner. Strict warnings keep portable C issues visible in CI.
      - name: Build host tests
        run: |
          mkdir -p build/host-tests
          gcc \
            -std=c11 \
            -Wall \
            -Wextra \
            -Werror \
            -pedantic \
            -IInc \
            -Itests/host/fakes \
            Src/osSemaphore.c \
            Src/osWaitQueue.c \
            tests/host/fakes/fake_os_kernel.c \
            tests/host/fakes/fake_os_port.c \
            tests/host/test_binary_semaphore.c \
            -o build/host-tests/test_binary_semaphore

      # A failed assertion exits non-zero and marks this job as failed.
      - name: Run host tests
        run: build/host-tests/test_binary_semaphore

  wait-queue:
    name: FIFO Wait Queue
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Run optimized code with sanitizers to expose invalid pointer access
      # and undefined C behavior. The queue uses no hardware or kernel fakes.
      - name: Build wait queue tests
        run: |
          mkdir -p build/host-tests
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -O2 -g \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -IInc Src/osWaitQueue.c tests/host/test_wait_queue.c \
            -o build/host-tests/test_wait_queue

      # Bound execution so a regression cannot hang forever in a cycle.
      - name: Run wait queue tests
        run: timeout 15s build/host-tests/test_wait_queue

  semaphore-fifo:
    name: Semaphore FIFO Integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      # Real semaphore, queue and kernel wait transitions; only IRQ and
      # context dispatch are replaced. No fake block/unblock implementation.
      - name: Build integration tests
        run: |
          mkdir -p build/host-tests
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -O2 -g \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -IInc -Itests/host/fakes \
            Src/osSemaphore.c Src/osWaitQueue.c Src/osKernelWait.c \
            tests/host/fakes/fake_os_port.c \
            tests/host/test_semaphore_fifo.c \
            -o build/host-tests/test_semaphore_fifo
      - name: Run integration tests
        run: timeout 15s build/host-tests/test_semaphore_fifo

  counting-semaphore:
    name: Counting Semaphore
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build counting tests
        run: |
          mkdir -p build/host-tests
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -O2 -g \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -IInc -Itests/host/fakes \
            Src/osSemaphore.c Src/osWaitQueue.c Src/osKernelWait.c \
            tests/host/fakes/fake_os_port.c \
            tests/host/test_counting_semaphore.c \
            -o build/host-tests/test_counting_semaphore
      - name: Run counting tests
        run: timeout 15s build/host-tests/test_counting_semaphore

  mutex:
    name: Basic Mutex
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build mutex tests
        run: |
          mkdir -p build/host-tests
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -O2 -g \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -IInc -Itests/host/fakes \
            Src/osMutex.c Src/osSemaphore.c Src/osWaitQueue.c Src/osKernelWait.c \
            tests/host/fakes/fake_os_port.c tests/host/test_mutex.c \
            -o build/host-tests/test_mutex
      - name: Run mutex tests
        run: timeout 15s build/host-tests/test_mutex
